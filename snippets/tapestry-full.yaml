id: snip-tapestry-full
label: New Tapestry Score Scaffold
displayText: New Tapestry Score (Full)
desc: Complete score template
category: Snippets
icon: 📄
context:
  - root
  - top
snippet: |
  tapestry:
    knots:
      base:
        tonic: "C4"
        weave: song
        engraving:
          title: "New PPT Score"
          composer: "Composer"
          colorNotes: true
          omitStem: true
          noteheadStyle: ppt
          strongBeatGridWeight: true
          show: [melody, gridSymbols, rhythmGrid, chordNames, pulseSignature]

    weaves:
      song:
        stitch:
          - coil:
              # melody: [Dox, Do, Me, So, Me, Do]
              # rhythm: [Do, Fi, Do, Fi, Do, 2]
              harmony: [Do, Fa, LaMe, So]
    coils:
      motif:
        melody: [Do]
