tapestry:
  knot:
    tonic: "Eb4"
    weave: song
    engraving:
      title: "Dracula"
      composer: "Tame Impala"
      arranger: "Callum + Midlife Muso"
      tagline: "http://midlifemuso.com"
      show:
        - melody
        - melodyCoilInterval
        - rhythmCoil
        - harmonyCoil
        - harmony
        - rhythmGrid
        - chordNames
      noteheadStyle: ppt
      colorNotes: true
      omitStem: true
      harmonyClef: "treble_8"
      zoom: 1

  coils:
    verseRhythm:
      rhythm: [Do, Fi, Do, Fi, Do, Fi, Do, Fi, Do, Fi, Do, Fi, La, Do, 1]
    verseMelody:
      parent: verseRhythm
      melody: [Dox, Do, Me, Do, Re, Do, La, Do, Te, Do, 1, Re, Te]
    chorusHarmonyRhythm:
      harmony: [FaMe^, 2, So^, 1, Le^]
      rhythm: [Do, 1, La, Do, 1, La, Fi, La, Do, 3]

  weaves:
    song:
      children:
        - coil:
            id: verse
            parent: verseMelody
            harmony: [DoMe, 3, TeMe, 3, DoMe]
        - coil: verse
        - coil:
            id: preBridge1
            parent: verseMelody
            harmony: [DoMe, 3, Te, 3, Le, 3, So]
        - coil:
            id: preBridge2
            melody: [Tex, Do, Te, Do, Ti, Do, Te, Te, Ti]
            harmony: [FaMe, 8, So]
            rhythm: [Do, Fi, Do, Fi, Do, Fi, Do, Fi, La, Do, 3]
        - coil:
            id: bridge
            melody: [Rex, Ra, Ti, Le, La, Ra, Re, Re]
            harmony: [So^, 5, Le^]
            rhythm: [DoxDo, Fi, La, Fi, Fi, Do, Fi, Do, 2]
        - coil: bridge
        - coil:
            id: bridge2
            melody: [Tix, Ra, Re, Te, Re, Ra]
            harmony: [So^, Le^]
            rhythm: [Do, Fi, Do, DoxDoxDo, Fi, Do, 2]
        - coil:
            id: chorus
            parent: chorusHarmonyRhythm
            melody: [Sox^, Te, Te, Ti, Ra, Ti, Le, Re]
        - coil: chorus
        - coil:
            id: chorusVariant
            parent: chorus
            melody: [Sox^, Te, Do, Fa, So, Do, Te, Re]
