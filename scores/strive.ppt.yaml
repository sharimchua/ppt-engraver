tapestry:
  knot:
    tonic: "A4"
    engraving:
      title: Strive
      composer: "Christopher Larkin"
      arranger: "Kieran Paramanathan"
      tagline: "http://midlifemuso.com"
      harmonyClef: treble_8
      colorNotes: true
      omitStem: true
      noteheadStyle: ppt
      show:
        - melody
        - harmony
        - harmonyCoil
        - rhythmCoil
        - melodyCoilInterval
        - rhythmGrid
        - chordNames
  weaves:
    song:
      children:
        - weave: introduction
        - weave: verse
    introduction:
      children:
        - coil:
            id: intro
            melody: [Dox, Do, Me, La, Me, La, Do, 1]
            harmony: [DoMe]
            rhythm: [Do, Me, Fi, La, Do, Me, Fi, La]
        - coil: intro
        - coil:
            id: intro_turnaround
            parents: intro
            melody: [Dox, Fa, Te, Ti, Te, Fa, Te, Ti]
        - coil:
            id: intro2
            parents: intro
            harmony: [Te]
        - coil:
            id: intro3
            parents: intro
            harmony: [Fa]
        - coil:
            id: intro4
            parents: intro_turnaround
            harmony: [Le, Te]
    verse:
      coils:
        _verse_harm:
          harmony: [DoMi]
        _verse1:
          parents: _verse_harm
          melody: [Dox, Do, Me, La, Me]
          rhythm: [Do, Fi, Do, Fi, Do, Do]
        _verse2:
          parents: _verse_harm
          melody: [Dox, Me, Re]
          rhythm: [DoxMe, Fi, La]
        _verse3:
          parents: _verse_harm
          melody: [Sox^, Te, Re, Te, Te, Re]
          rhythm: [Do, Fi, Le, Te, Do, Fi]
        full_verse:
          concat:
            - _verse1
            - _verse2
            - _verse3
      children:
        - coil: full_verse
